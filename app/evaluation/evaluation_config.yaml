# ManipuriGPT Phase 7 — Evaluation Configuration

model:
  path: "models/ManipuriGPT-135M-Base-v1.0"
  tokenizer_path: "models/ManipuriGPT-135M-Base-v1.0"
  logs_path: "models/ManipuriGPT-135M-Base-v1.0/trainer_state.json"
  device: "auto"

evaluation:
  output_dir: "evaluation"
  seed: 42
  max_eval_samples: 1000

prompts:
  canonical:
    - "ꯑꯩ"
    - "অদুগা"
    - "ꯃꯅꯤꯄꯨꯔ"
    - "ꯃꯅꯤꯄꯨꯔꯤ ꯂꯣꯟ ꯑꯁꯤ"
    - "ꯃꯅꯤꯄꯨꯔꯒꯤ ꯀꯪꯂꯩꯄꯥꯛ"
    - "মণিপুরী ভাষা"

decoding_strategies:
  greedy:
    do_sample: false
    temperature: 1.0
  top_k:
    do_sample: true
    top_k: 50
    temperature: 0.7
  top_p:
    do_sample: true
    top_p: 0.9
    temperature: 0.7
  temperatures:
    - 0.2
    - 0.7
    - 1.0

generation:
  max_new_tokens: 64
  repetition_penalty: 1.1

benchmarks:
  perplexity: "cache/benchmarks/benchmark_perplexity.jsonl"
  translation: "cache/benchmarks/benchmark_translation.jsonl"
  script_conversion: "cache/benchmarks/benchmark_script_conversion.jsonl"
  ocr_spelling: "cache/benchmarks/benchmark_ocr_spelling.jsonl"
